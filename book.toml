[book]
authors = ["Morg", "Tradução e adaptação PT-BR (não oficial)"]
language = "pt-BR"
src = "src"
title = "Yokubi (PT-BR)"

[output.html]
default-theme = "Navy"
additional-js = ["js/lunr.stemmer.support.js", "js/tinyseg.js", "js/lunr.jp.js", "js/lunr.multi.js", "js/load-lunr-plugin.js"]
additional-css = ["style/custom.css"]
no-section-label = true

[output.html.fold]
enable = true

[output.html.search]
use-boolean-and = true   # multiple search terms combined with AND opposed to OR

[preprocessor.furigana]
command = "python scripts/preprocess-furigana.py"
renderers = ["html"]
